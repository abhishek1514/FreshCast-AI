features:
  lags: [1, 2, 3, 7, 14, 21, 28]
  rolling_windows: [7, 14, 28]
  forecast_horizons: [7, 14, 30]

backtest:
  n_splits: 4
  test_window_days: 28
  gap_days: 0

service_level:
  target_cycle_service_level: 0.95 # 95% service level for safety stock (z ~ 1.645)
