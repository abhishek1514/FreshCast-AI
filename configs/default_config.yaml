# FreshCast System & Supply Chain Configuration

project:
  name: "FreshCast"
  version: "0.1.0"
  random_seed: 42

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  start_date: "2022-01-01"
  end_date: "2024-03-31" # ~2.25 years of daily history
  frequency: "D"

distribution_centers:
  - id: "DC_BOS"
    name: "Northeast Distribution Center (Boston)"
    capacity_cases: 500000
    base_volume_multiplier: 1.15
  - id: "DC_ATL"
    name: "Southeast Distribution Center (Atlanta)"
    capacity_cases: 650000
    base_volume_multiplier: 1.25
  - id: "DC_CHI"
    name: "Midwest Distribution Center (Chicago)"
    capacity_cases: 750000
    base_volume_multiplier: 1.40

# Perishable & High-Turnover Foodservice Categories & SKUs
skus:
  - id: "SKU_BEEF_SIRLOIN"
    name: "Choice Angus Beef Sirloin (10 lb case)"
    category: "Meat & Poultry"
    shelf_life_days: 6
    lead_time_days: 2
    unit_cost: 85.00
    unit_price: 110.00
    spoilage_cost_factor: 1.0  # 100% loss upon expiration
    stockout_penalty_multiplier: 1.5  # Lost margin + client goodwill penalty
    base_daily_demand: 120

