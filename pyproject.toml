[project]
name = "freshcast"
version = "0.1.0"
description = "Enterprise Foodservice Demand Forecasting & Perishable Inventory Optimization"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "statsmodels>=0.14.0",
    "prophet>=1.1.5",
    "optuna>=3.6.0",
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "pyyaml>=6.0.1",
    "joblib>=1.4.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "mlflow>=2.14.0",
    "dvc>=3.50.0",
    "datasets>=3.0.0",
    "holidays>=0.50",
    "pyarrow>=17.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freshcast"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
