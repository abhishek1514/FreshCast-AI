name: FreshCast Enterprise CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-code-quality:
    name: Lint & Code Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install black ruff

      - name: Run Black Code Formatter Check
        run: black --check src/ tests/ app/

      - name: Run Ruff Linter
        run: ruff check src/ tests/ app/

  unit-and-integration-tests:
    name: Automated Unit & API Tests
    runs-on: ubuntu-latest
    needs: lint-and-code-quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Generate synthetic dataset and train model for testing
        run: |
          uv run python -m freshcast.data.generator
          uv run python -m freshcast.models.train

      - name: Run Pytest Suite
        run: |
          uv run pytest tests/ -v

  mlops-pipeline-verification:
    name: DVC & MLflow Pipeline Verification
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Verify DVC Pipeline Execution
        run: |
          uv run dvc repro --force --no-run-cache

  docker-build-verification:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: freshcast:ci
